<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎂 生日惊喜</title>
<style>
/* ============================================================
   全局
============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  overflow: hidden;
  background: #f2a9be;
}
button { font-family: inherit; border: none; background: none; cursor: pointer; }

/* 屏幕切换 */
.screen {
  position: fixed; inset: 0;
  opacity: 0; pointer-events: none;
  transition: opacity .8s ease;
}
.screen.active { opacity: 1; pointer-events: auto; }

/* ============================================================
   第 1 屏 · 密码锁
============================================================ */
#lockScreen {
  display: flex; align-items: center; justify-content: center;
}
/* 📌【背景图 1：锁屏背景】图片链接稍后填入下方 JS 的 CONFIG.LOCK_BG，
   未填时显示此粉色渐变占位 */
.lock-bg {
  position: absolute; inset: 0; z-index: 0;
  background:
    radial-gradient(120% 90% at 50% 38%, #fbd3dc 0%, #f6b3c4 42%, #ef97af 72%, #e9809c 100%);
  background-size: cover; background-position: center;
}
.lock-card {
  position: relative; z-index: 1;
  width: min(88vw, 350px);
  padding: 34px 30px 20px;
  border-radius: 26px;
  background: rgba(255, 255, 255, .22);
  border: 1px solid rgba(255, 255, 255, .4);
  /* backdrop-filter 是移动端最耗性能的属性之一（每帧重算模糊）。
     这里用较轻的模糊 + 提升为独立合成层，兼顾观感与流畅度 */
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 18px 45px rgba(190, 80, 110, .25);
  display: flex; flex-direction: column; align-items: center;
  transition: transform .7s ease, opacity .7s ease;
  will-change: transform, opacity;
  transform: translateZ(0);
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}
.lock-card.exit { transform: scale(1.15); opacity: 0; }
.lock-card.shake { animation: shake .45s ease; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-9px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(4px); }
}

/* App 图标（可替换为自己的图片：往 .app-icon 里放 <img> 即可） */
.app-icon {
  width: 88px; height: 88px;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(180, 60, 100, .28);
  background: linear-gradient(160deg, #ffe9f0, #ffd0e0);
}
.app-icon svg { width: 100%; height: 100%; display: block; }

.lock-title {
  margin-top: 18px;
  color: #fff; font-size: 22px; font-weight: 700; letter-spacing: 1px;
  text-shadow: 0 2px 6px rgba(190, 90, 120, .35);
}
.lock-hint {
  margin-top: 8px;
  color: rgba(255, 255, 255, .92); font-size: 12px;
  display: flex; align-items: center; gap: 5px;
}
.lock-hint .num {
  display: inline-block; min-width: 17px; height: 17px; line-height: 15px;
  border: 1px solid rgba(255, 255, 255, .8); border-radius: 5px;
  font-size: 11px; text-align: center; padding: 0 2px;
}

/* 密码输入框 */
.input-wrap {
  margin-top: 16px;
  width: 100%; height: 46px;
  background: #fff; border-radius: 999px;
  display: flex; align-items: center;
  padding: 0 6px 0 20px;   /* 右侧留窄，让眼睛按钮完整落在框内 */
  box-shadow: 0 4px 14px rgba(190, 80, 110, .14);
}
.input-wrap input {
  flex: 1; min-width: 0; height: 100%;
  border: none; outline: none; background: transparent;
  text-align: center;
  font-size: 18px; letter-spacing: 6px;
  color: #555; caret-color: #ef7d95;
}
.input-wrap input::placeholder { letter-spacing: 1px; color: #c9c9c9; font-size: 14px; }
.input-wrap input:disabled { color: #bbb; }
.eye-btn {
  flex: 0 0 auto;
  width: 36px; height: 36px; margin-right: 4px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #a9a9a9;
  transition: background .2s ease, color .2s ease;
}
.eye-btn:active { background: rgba(239, 125, 149, .14); color: #ef7d95; }
.eye-btn svg { width: 20px; height: 20px; display: block; }

/* 消息 / 提示卡槽位（保持布局不跳动，出卡时自动撑高） */
.msg {
  height: 20px; margin-top: 9px;
  font-size: 12px; color: #e0475f;
  display: flex; align-items: center; justify-content: center;
  transition: height .35s ease, margin-top .35s ease;
}
.msg.hint-ok { color: #fff; }
.msg.has-card { height: auto; margin-top: 12px; }

/* 进入按钮 */
.enter-btn {
  margin-top: 4px;
  min-width: 108px; height: 38px;
  border-radius: 999px;
  background: linear-gradient(180deg, #f89a84, #ee7663);
  color: #fff; font-size: 14px; font-weight: 600; letter-spacing: 2px;
  box-shadow: 0 6px 16px rgba(230, 100, 80, .35);
  transition: transform .15s ease, box-shadow .15s ease, opacity .3s;
}
.enter-btn:active { transform: scale(.94); }
.enter-btn:disabled { opacity: .6; }

/* 底部提示（点击可查看密码提示） */
.footer-tip {
  margin-top: 16px;
  color: rgba(255, 255, 255, .78); font-size: 10.5px; letter-spacing: .5px;
  cursor: pointer;
  text-decoration: underline dotted rgba(255,255,255,.4);
  text-underline-offset: 3px;
  padding: 4px 8px; border-radius: 999px;
  transition: color .4s ease, opacity .4s ease, background .4s ease;
}
.footer-tip.locked { color: #ffe3a6; }
.footer-tip.sealed { opacity: .5; }   /* 未满 3 次时：看起来仍是可点的，实为机关 */

/* ── D 方案：满 3 次后底部小字的"呼吸发光"，提示它现在可以点了 ── */
.footer-tip.armed {
  color: #fff; opacity: 1;
  font-weight: 600;
  text-decoration: none;
  background: rgba(255, 255, 255, .18);
  animation: tipBreath 1.6s ease-in-out infinite;
}
@keyframes tipBreath {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.55); opacity: .82; }
  50%      { box-shadow: 0 0 0 9px rgba(255,255,255,0); opacity: 1; }
}

/* 满 3 次时，小字下方跳动的引导箭头 */
.tip-arrow {
  height: 0; overflow: visible;
  text-align: center; font-size: 13px; color: #fff;
  opacity: 0; transition: opacity .4s ease;
  margin-top: 2px;
}
.tip-arrow.show { opacity: .95; animation: arrowBob 1.2s ease-in-out infinite; }
@keyframes arrowBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

/* 满 3 次时浮现的引导语 */
.guide-line {
  font-size: 12.5px; color: #b8576d; letter-spacing: .5px;
  opacity: 0; transform: translateY(-4px);
  transition: opacity .5s ease, transform .5s ease;
  text-align: center;
}
.guide-line.show { opacity: 1; transform: translateY(0); }

/* ── A 方案：提示卡 ── */
.hint-card {
  position: relative;
  width: 100%;
  padding: 15px 16px 16px;
  border-radius: 16px;
  background: rgba(255, 255, 255, .9);
  border: 1.5px solid rgba(240, 150, 175, .65);
  box-shadow: 0 10px 26px rgba(200, 90, 125, .24),
              inset 0 0 0 1px rgba(255, 255, 255, .8);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0;
  transform: scale(.92) translateY(-6px);
  transition: opacity .42s cubic-bezier(.22,1,.36,1),
              transform .42s cubic-bezier(.22,1,.36,1);
  text-align: center;
}
.hint-card.show { opacity: 1; transform: scale(1) translateY(0); }
.hint-card .tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
  color: #d9557a;
  background: rgba(255, 226, 236, .95);
  border-radius: 999px;
  padding: 4px 11px;
  margin-bottom: 9px;
}
.hint-card .tag .bulb { animation: bulbPulse 1.8s ease-in-out infinite; display: inline-block; }
@keyframes bulbPulse {
  0%, 100% { transform: scale(1); filter: brightness(1); }
  50%      { transform: scale(1.16); filter: brightness(1.35); }
}
.hint-card .body {
  font-size: 14.5px; font-weight: 600; color: #c14a66;
  letter-spacing: .8px; line-height: 1.75;
}
/* 卡片出现后一道柔光扫过，强调"奖励感" */
.hint-card::after {
  content: ""; position: absolute; inset: 0; border-radius: 16px;
  background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.85) 50%, transparent 70%);
  background-size: 220% 100%;
  background-position: 130% 0;
  opacity: 0;
  pointer-events: none;
}
.hint-card.show::after { animation: sheen 1.1s ease-out .18s 1; }
@keyframes sheen {
  0% { opacity: .9; background-position: 130% 0; }
  100% { opacity: 0; background-position: -40% 0; }
}

/* 卡片飞入：从小字位置升起的"幽灵"元素
   用 transform + left/top 分离，避免同时动画 left/top 导致掉帧 */
.fly-ghost {
  position: fixed; z-index: 99;
  left: 0; top: 0;              /* 位置全部交给 transform 控制（GPU 合成层） */
  padding: 6px 14px; border-radius: 999px;
  background: rgba(255,255,255,.95);
  box-shadow: 0 8px 22px rgba(200, 90, 125, .3);
  font-size: 13px; font-weight: 600; color: #c14a66;
  pointer-events: none; white-space: nowrap;
  will-change: transform, opacity;
  transition: transform .72s cubic-bezier(.22, 1, .36, 1), opacity .72s ease;
}

/* ============================================================
   隐藏机关 · "湮灭" 过场
   （未输满 3 次就点底部提示时触发）
============================================================ */
#moment {
  position: fixed; inset: 0; z-index: 200;
  opacity: 0; pointer-events: none;
  transition: opacity .7s ease;
}
#moment.active { opacity: 1; pointer-events: auto; }

/* 深色夜空层：淡入 → 淹没 → 淡出（放慢，给足沉浸感） */
#moment .night {
  position: absolute; inset: 0;
  background: radial-gradient(120% 100% at 50% 42%, #20233c 0%, #14162a 55%, #0b0c16 100%);
  opacity: 0;
  transition: opacity .9s ease;
}
#moment.stage-night .night { opacity: 1; }
#moment.stage-fade .night { opacity: 0; transition: opacity 1s ease; }

/* 烟花画布 */
#momentCanvas { position: absolute; inset: 0; will-change: contents; }

/* 中央柔和白字（浮现更缓，停留感更强） */
#momentText {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%) translateY(14px);
  width: min(86vw, 560px);
  text-align: center;
  color: #fff; font-size: clamp(15px, 4.4vw, 21px);
  font-weight: 300; letter-spacing: 2.5px; line-height: 2;
  text-shadow: 0 0 18px rgba(255,255,255,.45), 0 2px 10px rgba(0,0,0,.4);
  opacity: 0;
  transition: opacity 1.8s ease, transform 1.8s ease;
}
#momentText.show { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
#momentText.hide { opacity: 0; transition: opacity 1.4s ease, transform 1.4s ease; transform: translate(-50%, -50%) translateY(-8px); }

/* ============================================================
   第 2 屏 · 生日主页面
============================================================ */
#mainScreen { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
/* 📌【背景图 2：主页面背景】填入 CONFIG.MAIN_BG，未填时用渐变占位 */
.main-bg {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(180deg, #ffeef3 0%, #ffd9e4 40%, #ffc4d6 100%);
  background-size: cover; background-position: center;
}
.main-wrap {
  position: relative; z-index: 1;
  max-width: 640px; margin: 0 auto;
  padding: 48px 22px 70px;
  display: flex; flex-direction: column; align-items: center;
}

/* —— 顶部英雄区 —— */
.hero { text-align: center; margin-bottom: 34px; }
.hero .sub { color: #c9647f; font-size: 14px; letter-spacing: 3px; margin-bottom: 10px; }
.hero h1 {
  font-size: clamp(30px, 8vw, 44px); font-weight: 800;
  background: linear-gradient(120deg, #f36d92, #e8557e 45%, #f7a06b);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 3px 4px rgba(230, 100, 130, .25));
}
.hero .date-pill {
  display: inline-block; margin-top: 14px;
  padding: 7px 18px; border-radius: 999px;
  background: rgba(255, 255, 255, .75);
  color: #d9557a; font-size: 13px; font-weight: 600; letter-spacing: 1px;
  box-shadow: 0 4px 12px rgba(220, 110, 140, .2);
}

/* —— 蛋糕区 —— */
.cake-section {
  width: 100%;
  background: rgba(255, 255, 255, .6);
  border: 1px solid rgba(255, 255, 255, .8);
  border-radius: 26px;
  padding: 26px 16px 22px;
  box-shadow: 0 12px 30px rgba(220, 110, 140, .16);
  text-align: center;
}
.cake-section h2 { color: #d9557a; font-size: 18px; letter-spacing: 1px; }
.cake-tip { color: #b98a97; font-size: 12.5px; margin: 7px 0 4px; }

.cake {
  position: relative; width: 236px; height: 210px;
  margin: 14px auto 4px;
}
.plate {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 250px; height: 26px; border-radius: 50%;
  background: radial-gradient(ellipse at center, #fff 55%, #f3d9e0 100%);
  box-shadow: 0 8px 18px rgba(190, 90, 120, .25);
}
.tier { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 14px; }
.tier.bottom {
  bottom: 12px; width: 216px; height: 86px;
  background: linear-gradient(180deg, #f7a8bd, #ef8aa5);
}
.tier.bottom::before, .tier.top::before { /* 奶油滴落 */
  content: ""; position: absolute; top: -7px; left: 0; right: 0; height: 16px;
  background: radial-gradient(circle at 10px 0, #fff 9px, transparent 10px) repeat-x;
  background-size: 28px 16px;
}
.tier.top {
  bottom: 92px; width: 158px; height: 66px;
  background: linear-gradient(180deg, #fbc6d4, #f6a9bf);
}
.candle-row {
  position: absolute; bottom: 152px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 34px;
}
.candle {
  position: relative; width: 13px; height: 46px; border-radius: 6px;
  background: repeating-linear-gradient(45deg, #fff 0 5px, #f98db0 5px 10px);
  cursor: pointer;
}
/* 烛火：默认不跑动画（主页面未显示时白白耗电），进入主页面后才点亮 */
.flame {
  position: absolute; top: -21px; left: 50%;
  width: 15px; height: 22px;
  transform: translateX(-50%);
  background: radial-gradient(circle at 50% 70%, #fff7d1 20%, #ffd66b 55%, #ff9a3d 85%);
  border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  box-shadow: 0 0 14px 4px rgba(255, 190, 90, .55);
  transition: opacity .35s, transform .35s;
  transform-origin: 50% 100%;
}
/* 只在主页面激活后才开始燃烧 */
#mainScreen.active .flame { animation: flicker .35s infinite alternate; }
@keyframes flicker {
  from { transform: translateX(-50%) scale(1) rotate(-2deg); }
  to   { transform: translateX(-50%) scale(.88, 1.08) rotate(2.5deg); }
}
.candle.out .flame { opacity: 0; transform: translateX(-50%) scale(.2); animation: none; }
.smoke {
  position: absolute; top: -16px; left: 50%; width: 8px; height: 8px; border-radius: 50%;
  background: rgba(160, 160, 160, .5); filter: blur(2px);
  opacity: 0; pointer-events: none;
}
.candle.out .smoke { animation: smokeUp 1s ease forwards; }
@keyframes smokeUp {
  0% { opacity: .8; transform: translate(-50%, 0) scale(.6); }
  100% { opacity: 0; transform: translate(-30%, -30px) scale(1.8); }
}
.wish-text {
  margin-top: 10px; font-size: 15px; color: #e8557e; font-weight: 700;
  opacity: 0; transform: translateY(8px); transition: all .7s ease;
}
.wish-text.show { opacity: 1; transform: translateY(0); }

/* —— 照片墙（占位） —— */
.photo-section { width: 100%; margin-top: 30px; }
.photo-section h2 { color: #d9557a; font-size: 18px; text-align: center; letter-spacing: 1px; margin-bottom: 16px; }
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.photo-item {
  aspect-ratio: 3/4; border-radius: 18px; overflow: hidden;
  border: 2.5px dashed #f2a9c0; background: rgba(255,255,255,.55);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; color: #d98aa2; font-size: 12px; text-align: center; padding: 8px;
}
.photo-item .ph-emoji { font-size: 30px; }
.photo-item img { width: 100%; height: 100%; object-fit: cover; }
.photo-item figcaption {
  background: rgba(255,255,255,.85); color: #c9647f;
  padding: 4px 10px; border-radius: 999px; font-size: 11px;
}

/* —— 信件 —— */
.letter-section { width: 100%; margin-top: 34px; display: flex; flex-direction: column; align-items: center; }
.envelope {
  position: relative; width: min(86%, 300px); height: 74px;
  background: linear-gradient(180deg, #fff, #ffeef3);
  border-radius: 14px;
  box-shadow: 0 10px 24px rgba(220, 110, 140, .22);
  display: flex; align-items: center; justify-content: center;
  color: #e8557e; font-weight: 700; letter-spacing: 2px; font-size: 15px;
  transition: transform .2s ease;
}
.envelope:hover { transform: translateY(-3px); }
.envelope::after {
  content: "✉ 点我拆开"; position: absolute; right: 12px; bottom: -22px;
  font-size: 11px; color: #c98aa0; letter-spacing: 1px;
}
.letter-paper {
  width: min(92%, 340px); max-height: 0; overflow: hidden; opacity: 0;
  margin-top: 0;
  transition: max-height 1s ease, opacity .8s ease, margin-top .8s ease;
}
.letter-paper.open {
  max-height: 600px; opacity: 1; margin-top: 30px;
}
.letter-paper .paper-inner {
  background: #fffdf8;
  border: 1px solid #f5e3d0;
  border-radius: 18px; padding: 24px 22px;
  box-shadow: 0 12px 30px rgba(200, 140, 120, .18);
  color: #7a5c58; font-size: 14.5px; line-height: 2;
  white-space: pre-wrap; text-align: justify;
}
.letter-paper .paper-inner .sign {
  display: block; margin-top: 14px; text-align: right; color: #d9557a; font-weight: 700;
}

.main-footer {
  margin-top: 46px; color: #cf8aa0; font-size: 11.5px; letter-spacing: 1px; text-align: center;
}

/* 音乐按钮（CONFIG.MUSIC 填入链接后自动显示） */
.music-btn {
  position: fixed; top: 18px; right: 18px; z-index: 50;
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,.8); box-shadow: 0 4px 14px rgba(220,110,140,.3);
  display: none; align-items: center; justify-content: center; font-size: 20px;
}
.music-btn.show { display: flex; }
.music-btn.playing { animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 彩带画布 */
#confetti { position: fixed; inset: 0; z-index: 40; pointer-events: none; will-change: contents; }
</style>
</head>
<body>

<!-- ================= 第 1 屏：密码锁 ================= -->
<section id="lockScreen" class="screen active">
  <div class="lock-bg" id="lockBg"></div>
  <div class="lock-card" id="lockCard">

    <!-- App 图标（整块可替换成自己的图片） -->
    <div class="app-icon">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff3f7"/>
            <stop offset="1" stop-color="#ffd9e6"/>
          </linearGradient>
          <linearGradient id="heartBg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fa9cc4"/>
            <stop offset="1" stop-color="#f46ba4"/>
          </linearGradient>
        </defs>
        <rect width="100" height="100" rx="24" fill="url(#iconBg)"/>
        <path d="M50 38 C45.5 25.5 27 28 29.5 41.5 C31 50 43 57 50 61.5 C57 57 69 50 70.5 41.5 C73 28 54.5 25.5 50 38 Z" fill="url(#heartBg)"/>
        <ellipse cx="38.5" cy="74" rx="7.2" ry="9" fill="#46333e"/>
        <ellipse cx="61.5" cy="74" rx="7.2" ry="9" fill="#46333e"/>
        <circle cx="40.8" cy="70.6" r="2.4" fill="#fff"/>
        <circle cx="63.8" cy="70.6" r="2.4" fill="#fff"/>
        <ellipse cx="50" cy="87" rx="3.4" ry="2" fill="#eda0bb"/>
      </svg>
    </div>

    <div class="lock-title">输入密码，开启惊喜</div>
    <div class="lock-hint">提示 <span class="num">8</span> 位字符</div>

    <div class="input-wrap">
      <input id="pwdInput" type="password" maxlength="8"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="请输入密码">
      <button class="eye-btn" id="eyeBtn" type="button" aria-label="显示或隐藏密码">

<div id="moment">

<script>
/* ════════════════════════════════════════════════════════════
   🎂 配置区：所有内容都在这里改，改完刷新即可
   ════════════════════════════════════════════════════════════ */
const CONFIG = {
  /* 8 位数字密码（进入惊喜页的密码） */
  PASSWORD: "20230901",

  /* 密码提示：必须输错满 3 次后点击底部小字才会显示 */
  PASSWORD_HINT: "悄悄告诉你：我们相识的日子～",

  /* 锁屏底部那行小字（对应示例图最下面一行） */
  LOCK_TIP: "忘记密码 · 输错 3 次自动加锁（点击查看提示）",

  /* ═══ 隐藏机关文案（未输满 3 次就点底部小字时触发）═══ */
  MOMENT_TEXT: "不要急着跳过回忆，想一想我们相遇的那一天",

  /* ═══ 背景图（你说的"一会再说"的部分，拿到图后填 URL 即可）═══ */
  LOCK_BG: "",   // 📌 背景图 1：密码锁屏整页背景，例如 "images/lock-bg.jpg"
  MAIN_BG: "",   // 📌 背景图 2：生日主页整页背景

  /* ═══ 主页面文案 ═══ */
  NAME: "宝贝",                 // 寿星名字
  DATE_TEXT: "2026 年 10 月 10 日",   // 显示在日期胶囊里的文字

  /* ═══ 照片墙：有图后按格式填，例如
     PHOTOS: [
       { src: "images/p1.jpg", caption: "第一次见面" },
       { src: "images/p2.jpg", caption: "我们的旅行" },
     ]
     不填则显示 3 个占位框                                       ═══ */
  PHOTOS: [],

  /* ═══ 信件内容 ═══ */
  LETTER: `亲爱的：

  这一年谢谢有你陪伴。
  愿你眼里有光，心中有爱，
  愿所有美好都如约而至。

  生日快乐，永远爱你。`,
  LETTER_SIGN: "—— 永远爱你的人",

  /* ═══ 背景音乐：填入 mp3 链接后右上角会出现音乐按钮 ═══ */
  MUSIC: "",
};

/* ══════════ 以下为逻辑代码，一般不用改 ══════════ */

/* ---------- 应用配置 ---------- */
const $ = (id) => document.getElementById(id);

$("heroTitle").textContent = CONFIG.NAME + "，生日快乐！";
$("datePill").textContent = "🎉 " + CONFIG.DATE_TEXT;
$("footerTip").textContent = CONFIG.LOCK_TIP;
$("letterBody").textContent = CONFIG.LETTER;
$("letterSign").textContent = CONFIG.LETTER_SIGN;

if (CONFIG.LOCK_BG) $("lockBg").style.backgroundImage = `url("${CONFIG.LOCK_BG}")`;
if (CONFIG.MAIN_BG) $("mainBg").style.backgroundImage = `url("${CONFIG.MAIN_BG}")`;

/* ---------- 密码锁 ---------- */
const pwdInput = $("pwdInput");
const enterBtn = $("enterBtn");
const msg = $("msg");
const lockCard = $("lockCard");
const footerTip = $("footerTip");
const tipArrow = $("tipArrow");

const MAX_ATTEMPTS = 3;   // 输满 3 次后开放密码提示
let attempts = 0;         // 已输错次数
let locked = false;       // 是否已加锁
let lockTimer = null;
let momentPlaying = false; // 机关过场进行中，锁住一切交互
let cardShown = false;     // 提示卡是否已升起

pwdInput.addEventListener("input", () => {
  /* 不限字符类型（数字/字母/符号均可），但最多 8 个字符 */
  pwdInput.value = pwdInput.value.slice(0, 8);
  /* 提示卡一旦升起就保留；仅未升起时才清空普通消息 */
  if (!cardShown) clearMsg();
});
pwdInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
enterBtn.addEventListener("click", tryUnlock);

/* 小眼睛：显示 / 隐藏密码 */
$("eyeBtn").addEventListener("click", () => {
  const show = pwdInput.type === "password";
  pwdInput.type = show ? "text" : "password";
  $("eyeOpen").style.display = show ? "none" : "";
  $("eyeClosed").style.display = show ? "" : "none";
});

/* ────────── 消息与提示卡 ────────── */
function clearMsg() {
  msg.className = "msg";
  msg.style.color = "";
  msg.innerHTML = "&nbsp;";
  cardShown = false;
}
function showMsg(text) {
  if (cardShown) return;      // 提示卡已升起时不覆盖，避免卡片被顶掉
  msg.className = "msg";
  msg.style.color = "#e0475f";
  msg.innerHTML = "&nbsp;";
  msg.textContent = text;
}

/* D 方案：满 3 次 → 小字呼吸发光 + 箭头跳动 + 浮现引导语 */
function armHint() {
  tipArrow.classList.add("show");
  footerTip.classList.add("armed");
  footerTip.classList.remove("sealed");
  /* 提示卡已经升起时，只保留卡片，不再重建引导态 */
  if (cardShown) return;
  msg.className = "msg";
  msg.style.color = "";
  msg.innerHTML = `<span class="guide-line" id="guideLine">三次机会用完啦 · 点下面发光的小字看看 👇</span>`;
  requestAnimationFrame(() => {
    const g = $("guideLine");
    if (g) g.classList.add("show");
  });
}

/* A 方案：点击后，提示从小字位置"升"起成为一张提示卡
   动画只用 transform（GPU 合成层），保证顺滑 */
function showHintCard() {
  if (cardShown) return;
  cardShown = true;

  const tipRect = footerTip.getBoundingClientRect();
  const slotRect = msg.getBoundingClientRect();

  /* ① 造一个"幽灵"贴着小字的位置起飞 */
  const ghost = document.createElement("div");
  ghost.className = "fly-ghost";
  ghost.textContent = "💡 " + CONFIG.PASSWORD_HINT;
  const startX = tipRect.left + tipRect.width / 2;
  const startY = tipRect.top;
  /* 用 transform 一次性定位（不触发重排） */
  ghost.style.transform = `translate3d(${startX}px, ${startY}px, 0) translate(-50%, 0) scale(.9)`;
  document.body.appendChild(ghost);

  /* 引导语与箭头先退场 */
  const g = $("guideLine");
  if (g) { g.classList.remove("show"); g.style.opacity = 0; }
  tipArrow.classList.remove("show");
  footerTip.classList.remove("armed");
  footerTip.style.opacity = ".45";

  /* ② 提前把卡片挂上去（但先透明），让下一步的动画不需要等 DOM 重建 */
  msg.className = "msg has-card";
  msg.innerHTML = `
    <div class="hint-card" id="hintCard">
      <div class="tag"><span class="bulb">💡</span>关于这串数字</div>
      <div class="body">${CONFIG.PASSWORD_HINT}</div>
    </div>`;
  msg.style.visibility = "hidden";   // 先藏住，等幽灵飞到位再显示

  /* ③ 下一帧：幽灵用 transform 平滑升向卡片位置 */
  requestAnimationFrame(() => {
    ghost.style.transform =
      `translate3d(${startX}px, ${slotRect.top + 26}px, 0) translate(-50%, 0) scale(1)`;
    ghost.style.opacity = ".12";
  });

  /* ④ 幽灵到位 → 收掉幽灵、亮出卡片（卡片自身有小幅淡入缩放） */
  setTimeout(() => {
    ghost.remove();
    msg.style.visibility = "";
    const card = $("hintCard");
    if (card) requestAnimationFrame(() => card.classList.add("show"));
    if (navigator.vibrate) navigator.vibrate(16);
  }, 700);
}

/* ────────── 底部小字点击 ──────────
   输满 3 次 → 升起密码提示卡
   不满 3 次（含 0 次）→ 触发"湮灭"机关              */
footerTip.addEventListener("click", () => {
  if (locked || momentPlaying) return;
  if (attempts >= MAX_ATTEMPTS) {
    showHintCard();
  } else {
    playMoment();
  }
});

function tryUnlock() {
  if (locked || momentPlaying) return;
  const val = pwdInput.value.trim();
  if (val.length !== 8) {
    showMsg("请输入完整的 8 位密码哦");
    shake();
    return;
  }
  if (val === CONFIG.PASSWORD) {
    unlockSuccess();
  } else {
    attempts++;
    pwdInput.value = "";
    if (attempts >= MAX_ATTEMPTS) {
      /* 输满 3 次：开放密码提示入口（A+D 引导） */
      armHint();
      shake();
    } else {
      showMsg(`密码不对哦，再想想（还有 ${MAX_ATTEMPTS - attempts} 次机会）`);
      shake();
    }
  }
}

function lockPage() {
  locked = true;
  let remain = 30;
  pwdInput.disabled = true;
  enterBtn.disabled = true;
  footerTip.classList.add("locked");
  const tick = () => {
    footerTip.textContent = `🔒 已加锁 · 请等待 ${remain} 秒后再试`;
    if (remain <= 0) {
      clearInterval(lockTimer);
      locked = false;
      attempts = 0;
      footerTip.classList.remove("locked", "sealed");
      pwdInput.disabled = false;
      enterBtn.disabled = false;
      footerTip.textContent = CONFIG.LOCK_TIP;
      clearMsg();
    }
    remain--;
  };
  tick();
  lockTimer = setInterval(tick, 1000);
}

function shake() {
  lockCard.classList.remove("shake");
  void lockCard.offsetWidth;
  lockCard.classList.add("shake");
}

function unlockSuccess() {
  showMsg("✓ 密码正确");
  msg.style.color = "#2e9e6b";
  lockCard.classList.add("exit");
  setTimeout(() => {
    $("lockScreen").classList.remove("active");
    const main = $("mainScreen");
    main.classList.add("active");
    startConfettiRain();
    burst(160);                    // 进场先撒一波彩带
  }, 650);
}

/* ════════════════════════════════════════════════════════════
   隐藏机关 · "湮灭"
   1) 黑暗中极短闪现金色烟花碎星（期待感）
   2) 所有粒子快速褪色消散，融回深色夜空
   3) 不跳转主页面
   4) 中央浮现柔和白字停 3 秒
   5) 文字淡出，自动回到密码界面，清空输入框，保留剩余次数
   ════════════════════════════════════════════════════════════ */
const momentEl = $("moment");
const momentCanvas = $("momentCanvas");
const momentText = $("momentText");
const mctx = momentCanvas.getContext("2d");
let mps = [];            // 机关粒子
let mAlpha = 1;          // 全局淡出系数
let mRunning = false;

function mResize() {
  momentCanvas.width = innerWidth * DPR;
  momentCanvas.height = innerHeight * DPR;
  momentCanvas.style.width = innerWidth + "px";
  momentCanvas.style.height = innerHeight + "px";
  mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", mResize);

/* 生成一小簇金色火花 */
function mSpark(x, y, power) {
  const a = Math.random() * Math.PI * 2;
  const sp = Math.random() * power;
  return {
    x, y,
    vx: Math.cos(a) * sp,
    vy: Math.sin(a) * sp,
    size: 1 + Math.random() * 2.2,
    hue: 38 + Math.random() * 18,      // 金橙色调
    lum: 62 + Math.random() * 22,
    life: 1,
    decay: .006 + Math.random() * .010,  // 更慢的衰减
    trail: [],
  };
}

function mBurst(cx, cy, power, count) {
  for (let i = 0; i < count; i++) mps.push(mSpark(cx, cy, power));
  wakeMoment();          // 粒子落地即刻唤醒渲染循环（否则循环会因空粒子提前停机）
}

function playMoment() {
  if (momentPlaying) return;
  momentPlaying = true;

  /* 锁定输入，但保留已输错的次数 attempts */
  pwdInput.disabled = true;
  enterBtn.disabled = true;
  pwdInput.value = "";
  clearMsg();

  mResize();
  mps = [];
  mAlpha = 1;
  mRunning = true;
  wakeMoment();
  momentText.textContent = CONFIG.MOMENT_TEXT;
  momentText.classList.remove("show", "hide");

  /* 深色夜空缓缓浮起 */
  momentEl.classList.add("active");
  requestAnimationFrame(() => momentEl.classList.add("stage-night"));

  const cx = innerWidth / 2;
  const cy = innerHeight * 0.42;

  /* —— 步骤 1：金色烟花绽放（放慢，约 1.2s 铺开）—— */
  setTimeout(() => { mBurst(cx, cy, 7.5, 90); }, 700);
  setTimeout(() => {
    mBurst(cx - innerWidth * 0.24, cy + 40, 6, 55);
    mBurst(cx + innerWidth * 0.24, cy + 20, 6, 55);
  }, 1050);

  /* —— 步骤 2：粒子渐渐褪色湮灭（夜空保持黑暗，只让星光熄灭）—— */
  setTimeout(() => { mps.forEach(p => { p.decay = .022 + Math.random() * .022; }); }, 2000);

  /* —— 步骤 4：夜色正浓时，中央柔和白字缓缓浮现，停留 3 秒 —— */
  setTimeout(() => {
    mAlpha = 0;                       // 粒子余烬彻底停息
    momentText.classList.add("show");
  }, 3000);

  /* —— 步骤 5：文字淡出 → 夜空整体淡出 → 回到密码界面 —— */
  setTimeout(() => { momentText.classList.remove("show"); momentText.classList.add("hide"); }, 6200);
  setTimeout(() => { momentEl.classList.add("stage-fade"); }, 7300);
  setTimeout(() => {
    momentEl.classList.remove("active", "stage-fade", "stage-night");
    mRunning = false;
    mps = [];
    mctx.clearRect(0, 0, momentCanvas.width, momentCanvas.height);
    /* 回到锁屏：清空输入框、保留剩余尝试次数（attempts 不变） */
    pwdInput.value = "";
    pwdInput.type = "password";
    $("eyeOpen").style.display = "";
    $("eyeClosed").style.display = "none";
    clearMsg();
    if (locked) { pwdInput.disabled = true; enterBtn.disabled = true; }
    else { pwdInput.disabled = false; enterBtn.disabled = false; }
    momentText.classList.remove("show", "hide");
    momentPlaying = false;
  }, 8300);
}

/* 机关粒子渲染循环（拖尾 + 金色辉光，整体节奏放缓）
   同样只在过场进行时跑 RAF，空闲时停掉 */
let mRafId = null;
function wakeMoment() {
  if (mRafId === null) mRafId = requestAnimationFrame(mLoop);
}
function mLoop() {
  mctx.clearRect(0, 0, momentCanvas.width, momentCanvas.height);
  /* 过场结束后才停机；过场进行中即使暂时没有粒子也要继续等（烟花是延迟生成的） */
  if (!mRunning) {
    mRafId = null;             // 收工：停掉循环
    return;
  }
  for (const p of mps) {
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 10) p.trail.shift();   // 拖尾更长，飞行轨迹更慢更清晰

    p.vy += .022;        // 更轻的重力，下落更缓
    p.vx *= .990;        // 阻尼更小，滑行更久
    p.vy *= .990;
    p.x += p.vx;
    p.y += p.vy;

    if (mAlpha > 0) {
      p.life -= p.decay;
      if (p.life <= 0) { p.life = 0; continue; }

      const a = p.life * mAlpha;
      /* 拖尾 */
      mctx.beginPath();
      const t0 = p.trail[0];
      if (t0) {
        mctx.moveTo(t0.x, t0.y);
        mctx.lineTo(p.x, p.y);
        mctx.strokeStyle = `hsla(${p.hue}, 100%, ${p.lum}%, ${a * .45})`;
        mctx.lineWidth = p.size * .7;
        mctx.stroke();
      }
      /* 核心光点 */
      mctx.beginPath();
      mctx.arc(p.x, p.y, p.size, 0, 7);
      mctx.fillStyle = `hsla(${p.hue}, 100%, ${Math.min(88, p.lum + 18)}%, ${a})`;
      mctx.shadowBlur = 10;
      mctx.shadowColor = `hsla(${p.hue}, 100%, 65%, ${a * .9})`;
      mctx.fill();
      mctx.shadowBlur = 0;
    }
  }
  mps = mps.filter(p => p.life > 0);
  mRafId = requestAnimationFrame(mLoop);
}

/* 未满 3 次时，底部小字视觉上略微收敛（仍可点击，构成机关） */
footerTip.classList.add("sealed");

/* ---------- 照片墙 ---------- */
const grid = $("photoGrid");
if (CONFIG.PHOTOS.length > 0) {
  grid.innerHTML = CONFIG.PHOTOS.map(p => `
    <figure class="photo-item">
      <img src="${p.src}" alt="${p.caption || ""}">
      ${p.caption ? `<figcaption>${p.caption}</figcaption>` : ""}
    </figure>`).join("");
} else {
  /* 占位：稍后把图片放进 CONFIG.PHOTOS 即可自动替换 */
  grid.innerHTML = Array.from({ length: 3 }).map(() => `
    <figure class="photo-item">
      <div class="ph-emoji">📷</div>
      <div>照片 / 背景图<br>稍后替换</div>
    </figure>`).join("");
}

/* ---------- 信件 ---------- */
$("envelope").addEventListener("click", () => {
  $("letterPaper").classList.toggle("open");
  if ($("letterPaper").classList.contains("open")) {
    setTimeout(() => $("letterPaper").scrollIntoView({ behavior: "smooth", block: "center" }), 300);
  }
});

/* ---------- 蜡烛 ---------- */
const candles = [...document.querySelectorAll(".candle")];
const candleCount = $("candleCount");
const wishText = $("wishText");
candles.forEach(c => c.addEventListener("click", () => {
  if (c.classList.contains("out")) return;
  c.classList.add("out");
  const left = candles.filter(x => !x.classList.contains("out")).length;
  candleCount.textContent = left > 0 ? `还剩 ${left} 根蜡烛` : "蜡烛全部熄灭啦 🎉";
  if (left === 0) {
    wishText.classList.add("show");
    burst(220);
  }
}));

/* ---------- 音乐 ---------- */
if (CONFIG.MUSIC) {
  const audio = new Audio(CONFIG.MUSIC);
  audio.loop = true;
  const btn = $("musicBtn");
  btn.classList.add("show");
  btn.addEventListener("click", () => {
    if (audio.paused) { audio.play(); btn.classList.add("playing"); btn.textContent = "🎶"; }
    else { audio.pause(); btn.classList.remove("playing"); btn.textContent = "🎵"; }
  });
}

/* ---------- 彩带粒子 ---------- */
const canvas = $("confetti");
const ctx = canvas.getContext("2d");
let W, H, particles = [], raining = false;

/* 用 devicePixelRatio 自适应，但限制上限，避免高 DPI 屏上过度绘制 */
const DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize() {
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener("resize", resize);

const COLORS = ["#ff7fa5", "#ffb3c8", "#ffd08a", "#ff9a76", "#f36d92", "#ffe3ee", "#f9d56e"];
const SHAPES = ["rect", "circle", "heart"];

function spawn(x, y, power) {
  return {
    x, y,
    vx: (Math.random() - .5) * power,
    vy: Math.random() * -power * .9 - 2,
    size: 5 + Math.random() * 7,
    color: COLORS[(Math.random() * COLORS.length) | 0],
    shape: SHAPES[(Math.random() * SHAPES.length) | 0],
    rot: Math.random() * Math.PI,
    vr: (Math.random() - .5) * .25,
    sway: Math.random() * Math.PI * 2,
    life: 1,
  };
}
function burst(n) {
  for (let i = 0; i < n; i++) particles.push(spawn(W / 2, H * .45, 11));
  wakeConfetti();
}
function startConfettiRain() {
  raining = true;
  wakeConfetti();
}
/* 画布绘制函数 */
function drawHeart(s) {
  ctx.beginPath();
  ctx.moveTo(0, s * .35);
  ctx.bezierCurveTo(0, 0, -s, 0, -s, s * .4);
  ctx.bezierCurveTo(-s, s * .8, 0, s, 0, s * 1.25);
  ctx.bezierCurveTo(0, s, s, s * .8, s, s * .4);
  ctx.bezierCurveTo(s, 0, 0, 0, 0, s * .35);
  ctx.fill();
}

/* 只在有粒子时跑 RAF；空闲时彻底停掉，避免持续占 CPU/GPU */
let rafId = null;
let confettiActive = false;
function wakeConfetti() {
  if (rafId === null) rafId = requestAnimationFrame(loop);
}
function loop() {
  const hasParticles = particles.length > 0;
  if (!confettiActive && !hasParticles && !raining) {
    rafId = null;                 // 收工：停掉循环
    ctx.clearRect(0, 0, W, H);
    return;
  }
  confettiActive = false;

  ctx.clearRect(0, 0, W, H);
  if (raining && Math.random() < .12) {
    const p = spawn(Math.random() * W, -20, 3);
    p.vy = 1 + Math.random() * 2; p.vx = 0;
    particles.push(p);
  }
  particles = particles.filter(p => p.y < H + 40 && p.life > 0);
  for (const p of particles) {
    p.vy += .06;
    p.sway += .05;
    p.x += p.vx + Math.sin(p.sway) * .8;
    p.y += p.vy;
    p.rot += p.vr;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = .95;
    if (p.shape === "rect") ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * .66);
    else if (p.shape === "circle") { ctx.beginPath(); ctx.arc(0, 0, p.size / 2.4, 0, 7); ctx.fill(); }
    else drawHeart(p.size * .8);
    ctx.restore();
  }
  rafId = requestAnimationFrame(loop);
}
</script>
